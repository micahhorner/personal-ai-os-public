schema: migration-manifest
schema_version: 1.1.0
additional_properties: false
required:
  - schema_version
  - id
  - version_target
  - source_distribution
  - source_identity
  - from_version
  - to_version
  - prerequisites
  - content_selector
  - transform
  - validation
  - rollback
  - idempotency_key
  - manifest_hash
semantics:
  version_source: Exact SYSTEM-MANIFEST.yaml system key selected by version_target
  source_distribution: Exact SYSTEM-MANIFEST.yaml system.distribution_id from the closed vocabulary personal-ai-os or pmm-engine; absent, unknown, or different values fail closed before transforms
  source_identity: Local baseline identity SHA-256; mismatch detection, not provenance authentication
  manifest_hash: SHA-256 of canonical JSON with manifest_hash omitted
  transforms: Hash-bound replace_exact_files only; old_sha256 may enumerate exact known old/postcondition hashes, and every other byte sequence is refused
  validation: Must include vault-validate
  ledger: System/Journal/migration-ledger.jsonl
  ledger_integrity: Duplicate-key and duplicate-record rejection plus manifest/prerequisite consistency; external anchoring required for tamper proof
  repeat: same id and hash is a no-op; a changed hash is refused
  apply: Exact-edge upgrade candidate only; public apply is refused
  rollback: Outer upgrade transaction owns exact checkpoint and candidate discard
