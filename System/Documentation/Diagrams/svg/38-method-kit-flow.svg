<svg width="100%" viewBox="0 0 680 356" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — method-kit flow</title>
<desc>The method-kit capability interviews the user about how they run their work, sets eleven personalization dials from evidence-graded answers, generates their own operating-method pack into their user layer, wires pack-skills to follow it, has the user ratify it, and records it — a rulebook the user owns, captured from how they already work rather than imposed.</desc>
<text class="th" x="40" y="28">method-kit — turn how you work into your own operating method</text>
<g class="c-amber"><rect x="40" y="44" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="68" text-anchor="start" style="font-size:16px">1</text><text class="th" x="100" y="68" text-anchor="start">Interview</text><text class="ts" x="624" y="68" text-anchor="end">8 sections, ~45 min · evidence graded E1–E4</text></g>
<g class="c-blue"><rect x="40" y="92" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="116" text-anchor="start" style="font-size:16px">2</text><text class="th" x="100" y="116" text-anchor="start">Resolve the 11 dials</text><text class="ts" x="624" y="116" text-anchor="end">conservative default where signal is thin</text></g>
<g class="c-blue"><rect x="40" y="140" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="164" text-anchor="start" style="font-size:16px">3</text><text class="th" x="100" y="164" text-anchor="start">Generate the pack</text><text class="ts" x="624" y="164" text-anchor="end">their rulebook, in their user layer</text></g>
<g class="c-blue"><rect x="40" y="188" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="212" text-anchor="start" style="font-size:16px">4</text><text class="th" x="100" y="212" text-anchor="start">Wire the skills</text><text class="ts" x="624" y="212" text-anchor="end">pack-skills point at their pack</text></g>
<g class="c-blue"><rect x="40" y="236" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="260" text-anchor="start" style="font-size:16px">5</text><text class="th" x="100" y="260" text-anchor="start">Ratify</text><text class="ts" x="624" y="260" text-anchor="end">they read it back and amend; their sign-off</text></g>
<g class="c-green"><rect x="40" y="284" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="308" text-anchor="start" style="font-size:16px">6</text><text class="th" x="100" y="308" text-anchor="start">Yours to keep</text><text class="ts" x="624" y="308" text-anchor="end">edit or delete anytime; purely additive</text></g>
<text class="ts" x="40" y="344" text-anchor="start">The pack is the user's — captured from how they already work, never imposed.</text>
</svg>
