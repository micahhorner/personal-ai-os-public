<svg width="100%" viewBox="0 0 680 250" role="img">
<title>AI OS flow — Add Spoken / Tacit Context (user walkthrough)</title>
<desc>The spoken-context flow from the user's view: you say something not written down; the system captures it as a first-class source labeled as your recollection with a confidence level; you get preserved tacit knowledge with clear provenance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="26">Add spoken / tacit context (Flow 5)</text>
<text class="ts" x="130" y="52" text-anchor="middle">YOU DO</text>
<text class="ts" x="340" y="52" text-anchor="middle">BEHIND THE SCENES</text>
<text class="ts" x="550" y="52" text-anchor="middle">YOU GET</text>
<g class="c-blue"><rect x="40" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="th" x="56" y="88" text-anchor="start">Tell it something not</text><text class="th" x="56" y="106" text-anchor="start">written down:</text><text class="th" x="56" y="124" text-anchor="start"></text><text class="th" x="56" y="142" text-anchor="start">"The client hates</text><text class="th" x="56" y="160" text-anchor="start">surprises — preview</text><text class="th" x="56" y="178" text-anchor="start">changes first."</text></g>
<line x1="220" y1="137" x2="250" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="250" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="266" y="88" text-anchor="start">Captures it as a first-class</text><text class="ts" x="266" y="106" text-anchor="start">Source</text><text class="ts" x="266" y="124" text-anchor="start">Labels it as coming from</text><text class="ts" x="266" y="142" text-anchor="start">YOU, with a confidence level</text><text class="ts" x="266" y="160" text-anchor="start">Connects it to the right</text><text class="ts" x="266" y="178" text-anchor="start">people and projects</text></g>
<line x1="430" y1="137" x2="460" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="460" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="476" y="88" text-anchor="start">Tacit knowledge preserved</text><text class="ts" x="476" y="106" text-anchor="start">and usable</text><text class="ts" x="476" y="124" text-anchor="start">Clearly marked as your</text><text class="ts" x="476" y="142" text-anchor="start">recollection, not fact</text></g>
<text class="ts" x="40" y="238" text-anchor="start">Your recollections are never presented as hard evidence — the system always shows where a claim came from.</text>
</svg>
