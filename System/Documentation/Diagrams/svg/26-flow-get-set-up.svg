<svg width="100%" viewBox="0 0 680 250" role="img">
<title>AI OS flow — Get Set Up (user walkthrough)</title>
<desc>The onboarding flow from the user's view: open your AI and ask it to set up; it orients you, sets privacy first, and makes the folder yours; you get a private, ready vault after two stages.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="26">Get set up — make the folder yours (Flow 1)</text>
<text class="ts" x="130" y="52" text-anchor="middle">YOU DO</text>
<text class="ts" x="340" y="52" text-anchor="middle">BEHIND THE SCENES</text>
<text class="ts" x="550" y="52" text-anchor="middle">YOU GET</text>
<g class="c-blue"><rect x="40" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="th" x="56" y="88" text-anchor="start">1. Open your AI in this</text><text class="th" x="56" y="106" text-anchor="start">   folder</text><text class="th" x="56" y="124" text-anchor="start">2. Say: 'Read START-HERE</text><text class="th" x="56" y="142" text-anchor="start">   and set this up for me'</text><text class="th" x="56" y="160" text-anchor="start">3. Answer a few questions</text><text class="th" x="56" y="178" text-anchor="start">   (skip any you like)</text></g>
<line x1="220" y1="137" x2="250" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="250" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="266" y="88" text-anchor="start">Explains what it may/may not</text><text class="ts" x="266" y="106" text-anchor="start">do; shows the off switch</text><text class="ts" x="266" y="124" text-anchor="start">Sets your privacy rules</text><text class="ts" x="266" y="142" text-anchor="start">BEFORE collecting anything</text><text class="ts" x="266" y="160" text-anchor="start">Makes the folder YOURS</text><text class="ts" x="266" y="178" text-anchor="start">Saves progress continuously</text></g>
<line x1="430" y1="137" x2="460" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="460" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="476" y="88" text-anchor="start">A vault that's yours, private</text><text class="ts" x="476" y="106" text-anchor="start">by your own rules</text><text class="ts" x="476" y="124" text-anchor="start">Productive after just the</text><text class="ts" x="476" y="142" text-anchor="start">first two stages</text></g>
<text class="ts" x="40" y="238" text-anchor="start">Recommended: open the folder in Obsidian (ships pre-configured) — the easy way to use your vault. Ready after two stages.</text>
</svg>
