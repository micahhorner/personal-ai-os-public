<svg width="100%" viewBox="0 0 680 322" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — the agent model</title>
<desc>Three scoped agents — steward, onboarding-guide, and extension-builder — each with a role, the capabilities it uses, and a hard guardrail. All share a contract: vault operations only and no self-modification.</desc>
<text class="th" x="40" y="28">Three agents — scoped roles, shared guardrails, none can modify itself</text>
<g class="c-teal"><rect x="40" y="48" width="186" height="212" rx="12" stroke-width="0.5"/><text class="th" x="56" y="72" text-anchor="start">steward</text><text class="ts" x="56" y="94" text-anchor="start">Audit health, freshness,</text><text class="ts" x="56" y="110" text-anchor="start">integrity, conformance</text><text class="th" x="56" y="138" text-anchor="start">Uses</text><text class="ts" x="56" y="156" text-anchor="start">maintain-vault, ingest,</text><text class="ts" x="56" y="172" text-anchor="start">retrieve, safe-write,</text><text class="ts" x="56" y="188" text-anchor="start">recover</text><text class="th" x="56" y="216" text-anchor="start">Guardrail</text><text class="ts" x="56" y="234" text-anchor="start">Recommend-only: never</text><text class="ts" x="56" y="250" text-anchor="start">deletes; resolves nothing</text></g>
<g class="c-green"><rect x="247" y="48" width="186" height="212" rx="12" stroke-width="0.5"/><text class="th" x="263" y="72" text-anchor="start">onboarding-guide</text><text class="ts" x="263" y="94" text-anchor="start">Run the onboarding</text><text class="ts" x="263" y="110" text-anchor="start">state machine end to end</text><text class="th" x="263" y="138" text-anchor="start">Uses</text><text class="ts" x="263" y="156" text-anchor="start">safe-write, ingest,</text><text class="ts" x="263" y="172" text-anchor="start">retrieve-context</text><text class="th" x="263" y="216" text-anchor="start">Guardrail</text><text class="ts" x="263" y="234" text-anchor="start">Never touches System/;</text><text class="ts" x="263" y="250" text-anchor="start">bound by stage-2 privacy</text></g>
<g class="c-blue"><rect x="454" y="48" width="186" height="212" rx="12" stroke-width="0.5"/><text class="th" x="470" y="72" text-anchor="start">extension-builder</text><text class="ts" x="470" y="94" text-anchor="start">Design → scaffold →</text><text class="ts" x="470" y="110" text-anchor="start">test → register components</text><text class="th" x="470" y="138" text-anchor="start">Uses</text><text class="ts" x="470" y="156" text-anchor="start">build-extension,</text><text class="ts" x="470" y="172" text-anchor="start">safe-write, retrieve</text><text class="th" x="470" y="216" text-anchor="start">Guardrail</text><text class="ts" x="470" y="234" text-anchor="start">Never governance/schemas</text><text class="ts" x="470" y="250" text-anchor="start">or agent contracts</text></g>
<g class="c-gray"><rect x="40" y="272" width="600" height="42" rx="10" stroke-width="0.5"/><text class="ts" x="340" y="293" text-anchor="middle" dominant-baseline="central">Shared contract — uses vault operations only · no self-modification · an agent may never alter any agent's contract.</text></g>
</svg>