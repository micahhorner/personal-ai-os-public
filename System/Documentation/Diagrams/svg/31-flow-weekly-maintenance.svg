<svg width="100%" viewBox="0 0 680 250" role="img">
<title>AI OS flow — Weekly Maintenance (user walkthrough)</title>
<desc>The weekly maintenance flow from the user's view: you say run maintenance; the system health-checks, reports the inbox (it is never drained without a separate yes), triages freshness, rebuilds and checkpoints; you get a short list of judgment calls and everything else handled.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="26">Weekly maintenance (Flow 7)</text>
<text class="ts" x="130" y="52" text-anchor="middle">YOU DO</text>
<text class="ts" x="340" y="52" text-anchor="middle">BEHIND THE SCENES</text>
<text class="ts" x="550" y="52" text-anchor="middle">YOU GET</text>
<g class="c-blue"><rect x="40" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="th" x="56" y="88" text-anchor="start">Once a week, say:</text><text class="th" x="56" y="106" text-anchor="start"></text><text class="th" x="56" y="124" text-anchor="start">"Run weekly</text><text class="th" x="56" y="142" text-anchor="start">maintenance."</text></g>
<line x1="220" y1="137" x2="250" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="250" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="266" y="88" text-anchor="start">Health check: links, dupes,</text><text class="ts" x="266" y="106" text-anchor="start">review-due, inbox</text><text class="ts" x="266" y="124" text-anchor="start">Reports the Inbox; triages</text><text class="ts" x="266" y="142" text-anchor="start">freshness</text><text class="ts" x="266" y="160" text-anchor="start">Rebuilds indexes; takes a</text><text class="ts" x="266" y="178" text-anchor="start">fresh snapshot</text></g>
<line x1="430" y1="137" x2="460" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="460" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="476" y="88" text-anchor="start">A short list of judgment</text><text class="ts" x="476" y="106" text-anchor="start">calls, by consequence</text><text class="ts" x="476" y="124" text-anchor="start">Everything else handled; a</text><text class="ts" x="476" y="142" text-anchor="start">fresh restore point</text></g>
<text class="ts" x="40" y="238" text-anchor="start">The promise is no invisible maintenance: everything is handled, flagged, or noted as unaffected.</text>
</svg>
