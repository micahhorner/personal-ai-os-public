<svg width="100%" viewBox="0 0 680 250" role="img">
<title>AI OS flow — Bring Your Own Method &amp; Notes (user walkthrough)</title>
<desc>The bring-your-own-method flow from the user's view: you let it read your existing notes; it drafts a map of your method and can import your notes via dry-run and approval; you get a system that speaks your language and your notes moved in safely.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="26">Bring your own method &amp; notes (Flow 8)</text>
<text class="ts" x="130" y="52" text-anchor="middle">YOU DO</text>
<text class="ts" x="340" y="52" text-anchor="middle">BEHIND THE SCENES</text>
<text class="ts" x="550" y="52" text-anchor="middle">YOU GET</text>
<g class="c-blue"><rect x="40" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="th" x="56" y="88" text-anchor="start">During setup, allow a</text><text class="th" x="56" y="106" text-anchor="start">read-only look at your notes</text><text class="th" x="56" y="124" text-anchor="start"></text><text class="th" x="56" y="142" text-anchor="start">Then, if you want:</text><text class="th" x="56" y="160" text-anchor="start">"Bring my existing</text><text class="th" x="56" y="178" text-anchor="start">notes in."</text></g>
<line x1="220" y1="137" x2="250" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="250" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="266" y="88" text-anchor="start">Drafts a one-page map of</text><text class="ts" x="266" y="106" text-anchor="start">YOUR method (workstyle.md)</text><text class="ts" x="266" y="124" text-anchor="start">Uses your names and tags;</text><text class="ts" x="266" y="142" text-anchor="start">never-touch list is absolute</text><text class="ts" x="266" y="160" text-anchor="start">Import: dry-run to your</text><text class="ts" x="266" y="178" text-anchor="start">approval; nothing dropped</text></g>
<line x1="430" y1="137" x2="460" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="460" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="476" y="88" text-anchor="start">A system that speaks your</text><text class="ts" x="476" y="106" text-anchor="start">language and structure</text><text class="ts" x="476" y="124" text-anchor="start">Old notes moved in safely —</text><text class="ts" x="476" y="142" text-anchor="start">or left where they are</text></g>
<text class="ts" x="40" y="238" text-anchor="start">Your method map is yours: edit it anytime, or delete it and the system behaves as if it never existed.</text>
</svg>
