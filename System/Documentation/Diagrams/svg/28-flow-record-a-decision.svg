<svg width="100%" viewBox="0 0 680 250" role="img">
<title>AI OS flow — Record a Decision (user walkthrough)</title>
<desc>The record-a-decision flow from the user's view: you state the decision, reason, and revisit date; the system files one dated Decision record linked to its project; you get a durable, citable decision that resurfaces to review.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="26">Record a decision (Flow 4)</text>
<text class="ts" x="130" y="52" text-anchor="middle">YOU DO</text>
<text class="ts" x="340" y="52" text-anchor="middle">BEHIND THE SCENES</text>
<text class="ts" x="550" y="52" text-anchor="middle">YOU GET</text>
<g class="c-blue"><rect x="40" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="th" x="56" y="88" text-anchor="start">Say:</text><text class="th" x="56" y="106" text-anchor="start"></text><text class="th" x="56" y="124" text-anchor="start">"Record a decision:</text><text class="th" x="56" y="142" text-anchor="start">annual plan.</text><text class="th" x="56" y="160" text-anchor="start">Reason: cash flow.</text><text class="th" x="56" y="178" text-anchor="start">Revisit in January."</text></g>
<line x1="220" y1="137" x2="250" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="250" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="266" y="88" text-anchor="start">Creates one Decision record</text><text class="ts" x="266" y="106" text-anchor="start">Captures what / why / who /</text><text class="ts" x="266" y="124" text-anchor="start">when to revisit</text><text class="ts" x="266" y="142" text-anchor="start">Dates it and links to the</text><text class="ts" x="266" y="160" text-anchor="start">related project</text></g>
<line x1="430" y1="137" x2="460" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="460" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="476" y="88" text-anchor="start">A durable, dated decision</text><text class="ts" x="476" y="106" text-anchor="start">you can cite forever</text><text class="ts" x="476" y="124" text-anchor="start">It resurfaces for review</text><text class="ts" x="476" y="142" text-anchor="start">at revisit time</text></g>
<text class="ts" x="40" y="238" text-anchor="start">Decisions outrank old meeting notes later, so 'what did we decide' stays authoritative over the years.</text>
</svg>
