<svg width="100%" viewBox="0 0 680 302" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — versioning and migration</title>
<desc>Three things are semver-versioned: the whole system, the portability contract, and each note class schema. Major means breaking with a migration required; knowledge notes are not semver-versioned but tracked by supersession; structural change is an amendment.</desc>
<text class="th" x="40" y="28">What's versioned, and how breaking change happens safely</text>
<g class="c-blue"><rect x="40" y="46" width="186" height="52" rx="10" stroke-width="0.5"/><text class="th" x="133" y="68" text-anchor="middle" dominant-baseline="central">system_version</text><text class="ts" x="133" y="86" text-anchor="middle" dominant-baseline="central">the whole system</text></g>
<g class="c-blue"><rect x="247" y="46" width="186" height="52" rx="10" stroke-width="0.5"/><text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central">vault_profile_version</text><text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central">portability contract</text></g>
<g class="c-blue"><rect x="454" y="46" width="186" height="52" rx="10" stroke-width="0.5"/><text class="th" x="547" y="68" text-anchor="middle" dominant-baseline="central">schema_version</text><text class="ts" x="547" y="86" text-anchor="middle" dominant-baseline="central">per note class</text></g>
<g class="c-amber"><rect x="40" y="114" width="600" height="66" rx="12" stroke-width="0.5"/><text class="th" x="56" y="136" text-anchor="start">Semver — MAJOR.MINOR.PATCH</text><text class="ts" x="56" y="158" text-anchor="start">major = breaking (migration required) · minor = compatible addition · patch = correction</text><text class="ts" x="56" y="174" text-anchor="start">readers must tolerate one major version back; validate reports version stragglers</text></g>
<g class="c-teal"><rect x="40" y="196" width="290" height="90" rx="12" stroke-width="0.5"/><text class="th" x="56" y="218" text-anchor="start">Knowledge notes aren't semver'd</text><text class="ts" x="56" y="240" text-anchor="start">history = Git + checkpoints</text><text class="ts" x="56" y="260" text-anchor="start">identity via supersedes /</text><text class="ts" x="56" y="276" text-anchor="start">superseded_by chains</text></g>
<g class="c-purple"><rect x="350" y="196" width="290" height="90" rx="12" stroke-width="0.5"/><text class="th" x="366" y="218" text-anchor="start">Structural change = an amendment</text><text class="ts" x="366" y="240" text-anchor="start">numbered migration + human approval</text><text class="ts" x="366" y="260" text-anchor="start">+ spec version bump, logged in the</text><text class="ts" x="366" y="276" text-anchor="start">Decision Register</text></g>
</svg>