<svg width="100%" viewBox="0 0 680 312" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — knowledge model and component lifecycle</title>
<desc>Every record is one of eight note classes born from a template and checked against a schema; the eighth, working, is project material and lives only in the project layer. A ninth schema, component, describes capabilities, agents and workflows — a contract, not a record. New components follow a five-step lifecycle: design with sign-off, scaffold to draft, implement with a test, validate, then register to active.</desc>
<text class="th" x="40" y="28">How records and components come to exist</text>
<text class="ts" x="40" y="52" text-anchor="start">Every record is one class — born from a template, checked against a schema:</text>
<g class="c-blue"><rect x="40" y="62" width="68" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="74" y="78" text-anchor="middle" dominant-baseline="central">note</text></g>
<g class="c-blue"><rect x="116" y="62" width="68" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="150" y="78" text-anchor="middle" dominant-baseline="central">entity</text></g>
<g class="c-blue"><rect x="192" y="62" width="68" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="226" y="78" text-anchor="middle" dominant-baseline="central">decision</text></g>
<g class="c-blue"><rect x="268" y="62" width="68" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="302" y="78" text-anchor="middle" dominant-baseline="central">procedure</text></g>
<g class="c-blue"><rect x="344" y="62" width="68" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="378" y="78" text-anchor="middle" dominant-baseline="central">source</text></g>
<g class="c-blue"><rect x="420" y="62" width="68" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="454" y="78" text-anchor="middle" dominant-baseline="central">project</text></g>
<g class="c-blue"><rect x="496" y="62" width="68" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="530" y="78" text-anchor="middle" dominant-baseline="central">output</text></g>
<g class="c-blue"><rect x="572" y="62" width="68" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="606" y="78" text-anchor="middle" dominant-baseline="central">working</text></g>
<g class="c-blue"><rect x="40" y="100" width="68" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="80" y="116" text-anchor="middle" dominant-baseline="central">component</text></g>
<text class="ts" x="130" y="116" text-anchor="start" dominant-baseline="central">a ninth schema, for capabilities/agents/workflows — a contract, not a record</text>
<text class="ts" x="40" y="170" text-anchor="start">Adding a new component — design first, activate last:</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="40" y="186" width="108" height="64" rx="10" stroke-width="0.5"/><text class="th" x="94" y="212" text-anchor="middle" dominant-baseline="central">Design</text><text class="ts" x="94" y="230" text-anchor="middle" dominant-baseline="central">+ human sign-off</text></g>
<g class="c-blue"><rect x="163" y="186" width="108" height="64" rx="10" stroke-width="0.5"/><text class="th" x="217" y="212" text-anchor="middle" dominant-baseline="central">Scaffold</text><text class="ts" x="217" y="230" text-anchor="middle" dominant-baseline="central">→ draft status</text></g>
<g class="c-blue"><rect x="286" y="186" width="108" height="64" rx="10" stroke-width="0.5"/><text class="th" x="340" y="212" text-anchor="middle" dominant-baseline="central">Implement</text><text class="ts" x="340" y="230" text-anchor="middle" dominant-baseline="central">+ write its test</text></g>
<g class="c-teal"><rect x="409" y="186" width="108" height="64" rx="10" stroke-width="0.5"/><text class="th" x="463" y="212" text-anchor="middle" dominant-baseline="central">Validate</text><text class="ts" x="463" y="230" text-anchor="middle" dominant-baseline="central">aios validate</text></g>
<g class="c-green"><rect x="532" y="186" width="108" height="64" rx="10" stroke-width="0.5"/><text class="th" x="586" y="212" text-anchor="middle" dominant-baseline="central">Register</text><text class="ts" x="586" y="230" text-anchor="middle" dominant-baseline="central">→ active</text></g>
<line x1="148" y1="218" x2="163" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="271" y1="218" x2="286" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="394" y1="218" x2="409" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="517" y1="218" x2="532" y2="218" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="280" text-anchor="start">Hard limit: never governance, schemas, or agent contracts — those are amendments. No component grants itself permissions.</text>
</svg>