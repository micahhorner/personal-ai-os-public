<svg width="100%" viewBox="0 0 680 356" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — add-on pack lifecycle</title>
<desc>The manage-packs capability hash-binds a read-only archive review, requires exact reviewed apply, validates staged and live state, writes an activation receipt, then publishes the index. Removal transactionally archives user workspace, quarantines the pack, validates while reversible, and commits or restores; purge is explicit.</desc>
<text class="th" x="40" y="28">manage-packs — install an add-on by dropping its ZIP in the OS root</text>
<g class="c-amber"><rect x="40" y="44" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="68" text-anchor="start" style="font-size:16px">1</text><text class="th" x="100" y="68" text-anchor="start">Drop the pack ZIP in the OS root</text><text class="ts" x="624" y="68" text-anchor="end">no git, no CLI — just drop the file</text></g>
<g class="c-blue"><rect x="40" y="92" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="116" text-anchor="start" style="font-size:16px">2</text><text class="th" x="100" y="116" text-anchor="start">Verify and review exact archive hash</text><text class="ts" x="624" y="116" text-anchor="end">manifest + members bound before write</text></g>
<g class="c-blue"><rect x="40" y="140" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="164" text-anchor="start" style="font-size:16px">3</text><text class="th" x="100" y="164" text-anchor="start">Install or update?</text><text class="ts" x="624" y="164" text-anchor="end">folder absent → install · exists → replace</text></g>
<g class="c-blue"><rect x="40" y="188" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="212" text-anchor="start" style="font-size:16px">4</text><text class="th" x="100" y="212" text-anchor="start">Exact apply: checkpoint, stage-check, place</text><text class="ts" x="624" y="212" text-anchor="end">confirm + fresh review hash required</text></g>
<g class="c-blue"><rect x="40" y="236" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="260" text-anchor="start" style="font-size:16px">5</text><text class="th" x="100" y="260" text-anchor="start">Validate → receipt → publish index</text><text class="ts" x="624" y="260" text-anchor="end">installed tree hash becomes authority</text></g>
<g class="c-green"><rect x="40" y="284" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="308" text-anchor="start" style="font-size:16px">6</text><text class="th" x="100" y="308" text-anchor="start">Remove transactionally; purge only by name</text><text class="ts" x="624" y="308" text-anchor="end">archive · quarantine · validate · commit/restore</text></g>
<text class="ts" x="40" y="344" text-anchor="start">Install authority is receipted; removal preserves user work and stays reversible until green.</text>
</svg>
