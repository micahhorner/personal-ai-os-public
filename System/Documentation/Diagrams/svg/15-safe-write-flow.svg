<svg width="100%" viewBox="0 0 680 348" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — safe-write flow</title>
<desc>The safe-write capability resolves against existing records first, then branches into a create path or a change path, and always ends by validating. Duplicates are treated as corruption; approved records reset to pending when edited.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="28">safe-write — resolve first, then create or change; always validate</text>
<g class="c-amber"><rect x="40" y="44" width="600" height="42" rx="10" stroke-width="0.5"/><text class="ts" x="340" y="65" text-anchor="middle" dominant-baseline="central">Resolve first — search id → title → aliases → body phrases. Duplicates are corruption.</text></g>
<text class="ts" x="150" y="104" text-anchor="middle">new record</text>
<text class="ts" x="530" y="104" text-anchor="middle">already exists</text>
<line x1="185" y1="86" x2="185" y2="110" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="86" x2="495" y2="110" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="40" y="110" width="290" height="176" rx="12" stroke-width="0.5"/><text class="th" x="56" y="134" text-anchor="start">Create</text><text class="ts" x="56" y="160" text-anchor="start">Copy the class template</text><text class="ts" x="56" y="182" text-anchor="start">Fill required metadata (id immutable)</text><text class="ts" x="56" y="204" text-anchor="start">Sanitize the filename at birth</text><text class="ts" x="56" y="226" text-anchor="start">Ground it: sources · entities</text><text class="ts" x="56" y="248" text-anchor="start">Write to the folder the registry names</text></g>
<g class="c-blue"><rect x="350" y="110" width="290" height="176" rx="12" stroke-width="0.5"/><text class="th" x="366" y="134" text-anchor="start">Change</text><text class="ts" x="366" y="156" text-anchor="start">Identify what it is first:</text><text class="ts" x="378" y="174" text-anchor="start">source → annotate below the line</text><text class="ts" x="378" y="192" text-anchor="start">generated → fix the canonical input</text><text class="ts" x="378" y="210" text-anchor="start">approved → edit resets to pending</text><text class="ts" x="366" y="230" text-anchor="start">Smallest valid change; bump updated</text><text class="ts" x="366" y="248" text-anchor="start">Supersede? old → status: superseded</text><text class="ts" x="366" y="266" text-anchor="start">Consequential → four-outcome + journal</text></g>
<g class="c-purple"><rect x="40" y="298" width="600" height="44" rx="10" stroke-width="0.5"/><text class="ts" x="340" y="320" text-anchor="middle" dominant-baseline="central">Always: aios validate ends the session (+ links if refs changed). Never generate — indexes refresh at maintenance.</text></g>
</svg>