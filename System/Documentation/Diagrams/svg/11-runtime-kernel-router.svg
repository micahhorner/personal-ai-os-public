<svg width="100%" viewBox="0 0 680 376" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — runtime kernel and task router</title>
<desc>A small always-loaded runtime kernel holds the absolute rules. The task router matches the intent and loads only the procedures that row names, grouped into four modes: normal, maintenance, developer, and onboarding.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="28">Progressive disclosure — a tiny always-on kernel, everything else loaded on demand</text>
<g class="c-purple"><rect x="40" y="44" width="600" height="52" rx="12" stroke-width="0.5"/><text class="th" x="340" y="66" text-anchor="middle" dominant-baseline="central">Runtime Kernel — always loaded</text><text class="ts" x="340" y="84" text-anchor="middle" dominant-baseline="central">kill switch · privacy routing · protected objects · sources immutable · no secrets</text></g>
<line x1="340" y1="96" x2="340" y2="112" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="40" y="114" width="600" height="38" rx="10" stroke-width="0.5"/><text class="th" x="340" y="133" text-anchor="middle" dominant-baseline="central">Task Router — matches intent, loads only what the matched row names</text></g>
<line x1="110" y1="152" x2="110" y2="170" class="arr" marker-end="url(#arrow)"/>
<line x1="266" y1="152" x2="266" y2="170" class="arr" marker-end="url(#arrow)"/>
<line x1="422" y1="152" x2="422" y2="170" class="arr" marker-end="url(#arrow)"/>
<line x1="578" y1="152" x2="578" y2="170" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="40" y="172" width="140" height="158" rx="10" stroke-width="0.5"/><text class="th" x="110" y="192" text-anchor="middle" dominant-baseline="central">normal</text><text class="ts" x="52" y="216" text-anchor="start">answer · create ·</text><text class="ts" x="52" y="232" text-anchor="start">update · inbox ·</text><text class="ts" x="52" y="248" text-anchor="start">draft</text><text class="th" x="52" y="278" text-anchor="start">loads →</text><text class="ts" x="52" y="296" text-anchor="start">retrieve-context</text><text class="ts" x="52" y="312" text-anchor="start">safe-write · ingest</text></g>
<g class="c-teal"><rect x="196" y="172" width="140" height="158" rx="10" stroke-width="0.5"/><text class="th" x="266" y="192" text-anchor="middle" dominant-baseline="central">maintenance</text><text class="ts" x="208" y="216" text-anchor="start">weekly-pass ·</text><text class="ts" x="208" y="232" text-anchor="start">review-freshness ·</text><text class="ts" x="208" y="248" text-anchor="start">recover</text><text class="th" x="208" y="278" text-anchor="start">loads →</text><text class="ts" x="208" y="296" text-anchor="start">maintain-vault</text><text class="ts" x="208" y="312" text-anchor="start">steward · recover</text></g>
<g class="c-red"><rect x="352" y="172" width="140" height="158" rx="10" stroke-width="0.5"/><text class="th" x="422" y="192" text-anchor="middle" dominant-baseline="central">developer</text><text class="ts" x="364" y="216" text-anchor="start">any System/ ,</text><text class="ts" x="364" y="232" text-anchor="start">schema, or</text><text class="ts" x="364" y="248" text-anchor="start">component change</text><text class="th" x="364" y="278" text-anchor="start">loads →</text><text class="ts" x="364" y="296" text-anchor="start">full governance</text><text class="ts" x="364" y="312" text-anchor="start">stack + approval</text></g>
<g class="c-green"><rect x="508" y="172" width="140" height="158" rx="10" stroke-width="0.5"/><text class="th" x="578" y="192" text-anchor="middle" dominant-baseline="central">onboarding</text><text class="ts" x="520" y="216" text-anchor="start">run / resume ·</text><text class="ts" x="520" y="232" text-anchor="start">import-vault</text><text class="th" x="520" y="278" text-anchor="start">loads →</text><text class="ts" x="520" y="296" text-anchor="start">onboarding spec,</text><text class="ts" x="520" y="312" text-anchor="start">guide, import</text></g>
<text class="ts" x="40" y="356" text-anchor="start">The kernel preloads nothing extra; the matched row's load list is exhaustive. When unsure of the lane, load the heavier one.</text>
