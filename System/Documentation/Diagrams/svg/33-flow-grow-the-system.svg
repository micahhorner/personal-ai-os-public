<svg width="100%" viewBox="0 0 680 250" role="img">
<title>AI OS flow — Grow the System (user walkthrough)</title>
<desc>The grow-the-system flow from the user's view: you tell the Extension Builder your goal; it designs the smallest component, gets your sign-off, then scaffolds, tests, documents, and activates it; you get a new registered, tested, documented capability.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="26">Grow the system (Flow 9)</text>
<text class="ts" x="130" y="52" text-anchor="middle">YOU DO</text>
<text class="ts" x="340" y="52" text-anchor="middle">BEHIND THE SCENES</text>
<text class="ts" x="550" y="52" text-anchor="middle">YOU GET</text>
<g class="c-blue"><rect x="40" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="th" x="56" y="88" text-anchor="start">Tell the Extension Builder</text><text class="th" x="56" y="106" text-anchor="start">your goal:</text><text class="th" x="56" y="124" text-anchor="start"></text><text class="th" x="56" y="142" text-anchor="start">"A repeatable way to</text><text class="th" x="56" y="160" text-anchor="start">prep for client calls."</text></g>
<line x1="220" y1="137" x2="250" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="250" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="266" y="88" text-anchor="start">Checks if something already</text><text class="ts" x="266" y="106" text-anchor="start">does it (extend, don't invent)</text><text class="ts" x="266" y="124" text-anchor="start">Picks the least-powerful</text><text class="ts" x="266" y="142" text-anchor="start">component that works</text><text class="ts" x="266" y="160" text-anchor="start">One-page design to your</text><text class="ts" x="266" y="178" text-anchor="start">sign-off, then build + test</text></g>
<line x1="430" y1="137" x2="460" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="460" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="476" y="88" text-anchor="start">A new capability, registered,</text><text class="ts" x="476" y="106" text-anchor="start">tested, and documented</text><text class="ts" x="476" y="124" text-anchor="start">No schema design by you;</text><text class="ts" x="476" y="142" text-anchor="start">fully recoverable</text></g>
<text class="ts" x="40" y="238" text-anchor="start">Activation is gated: nothing goes live without passing tests AND being documented, with your approval.</text>
</svg>
