<svg width="100%" viewBox="0 0 680 250" role="img">
<title>AI OS flow — Ask &amp; Get Cited Answers (user walkthrough)</title>
<desc>The ask flow from the user's view: you ask in plain language; the system filters by privacy, finds the smallest trustworthy set of current records, and answers with citations or an honest nothing-found.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="26">Ask &amp; get cited answers (Flow 3)</text>
<text class="ts" x="130" y="52" text-anchor="middle">YOU DO</text>
<text class="ts" x="340" y="52" text-anchor="middle">BEHIND THE SCENES</text>
<text class="ts" x="550" y="52" text-anchor="middle">YOU GET</text>
<g class="c-blue"><rect x="40" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="th" x="56" y="88" text-anchor="start">Ask in plain language:</text><text class="th" x="56" y="106" text-anchor="start"></text><text class="th" x="56" y="124" text-anchor="start">"What did we decide</text><text class="th" x="56" y="142" text-anchor="start">about pricing, and why?"</text></g>
<line x1="220" y1="137" x2="250" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="250" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="266" y="88" text-anchor="start">Filters by your privacy</text><text class="ts" x="266" y="106" text-anchor="start">rules FIRST</text><text class="ts" x="266" y="124" text-anchor="start">Finds the smallest set of</text><text class="ts" x="266" y="142" text-anchor="start">current, trustworthy records</text><text class="ts" x="266" y="160" text-anchor="start">Prefers decisions; flags</text><text class="ts" x="266" y="178" text-anchor="start">anything stale</text></g>
<line x1="430" y1="137" x2="460" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="460" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="476" y="88" text-anchor="start">An answer citing your own</text><text class="ts" x="476" y="106" text-anchor="start">records by name</text><text class="ts" x="476" y="124" text-anchor="start">Or an honest 'your vault has</text><text class="ts" x="476" y="142" text-anchor="start">nothing on that'</text></g>
<text class="ts" x="40" y="238" text-anchor="start">Honest emptiness is a feature — it never pads an answer to look helpful.</text>
</svg>
