<svg width="100%" viewBox="0 0 680 372" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — tooling and generated state</title>
<desc>All 32 aios.py subcommands, grouped into read/report, documentation gates, build, change and system. Generate publishes three separately atomic domains: System/Generated, tool-owned skill projections, then freshness registry and ledger by compare-and-swap. System/Logs is mixed state, not disposable as a directory.</desc>
<text class="th" x="40" y="28">The tooling surface and its bounded publication domains</text>
