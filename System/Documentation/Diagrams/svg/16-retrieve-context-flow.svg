<svg width="100%" viewBox="0 0 680 356" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — retrieve-context flow</title>
<desc>The retrieve-context capability filters by privacy before ranking, orients via the generated index rather than opening notes in bulk, resolves to canonical records, checks freshness on access, assembles summary-first, and cites by name or abstains honestly.</desc>
<text class="th" x="40" y="28">retrieve-context — orient cheaply, load the load-bearing few, cite or abstain</text>
<g class="c-amber"><rect x="40" y="44" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="68" text-anchor="start" style="font-size:16px">1</text><text class="th" x="100" y="68" text-anchor="start">Filter before ranking</text><text class="ts" x="624" y="68" text-anchor="end">privacy · archive · drafts · stale out</text></g>
<g class="c-blue"><rect x="40" y="92" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="116" text-anchor="start" style="font-size:16px">2</text><text class="th" x="100" y="116" text-anchor="start">Orient via the generated index</text><text class="ts" x="624" y="116" text-anchor="end">never open notes in bulk (DEC-045)</text></g>
<g class="c-blue"><rect x="40" y="140" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="164" text-anchor="start" style="font-size:16px">3</text><text class="th" x="100" y="164" text-anchor="start">Resolve to canonical</text><text class="ts" x="624" y="164" text-anchor="end">follow supersession; decisions win</text></g>
<g class="c-blue"><rect x="40" y="188" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="212" text-anchor="start" style="font-size:16px">4</text><text class="th" x="100" y="212" text-anchor="start">Freshness-on-access</text><text class="ts" x="624" y="212" text-anchor="end">past review_due → flag + queue</text></g>
<g class="c-blue"><rect x="40" y="236" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="260" text-anchor="start" style="font-size:16px">5</text><text class="th" x="100" y="260" text-anchor="start">Assemble summary-first</text><text class="ts" x="624" y="260" text-anchor="end">bodies for the load-bearing few</text></g>
<g class="c-green"><rect x="40" y="284" width="600" height="40" rx="9" stroke-width="0.5"/><text class="th" x="58" y="308" text-anchor="start" style="font-size:16px">6</text><text class="th" x="100" y="308" text-anchor="start">Cite by name, or abstain</text><text class="ts" x="624" y="308" text-anchor="end">no evidence → say so honestly</text></g>
<text class="ts" x="40" y="344" text-anchor="start">More context is not better context — every unopened body is tokens saved.</text>
</svg>