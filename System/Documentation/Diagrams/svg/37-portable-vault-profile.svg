<svg width="100%" viewBox="0 0 680 284" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — the portable vault profile</title>
<desc>The portability contract: the rules every file follows (plain markdown, stable immutable IDs, cross-platform-safe names, file classes, folder-registry indirection) guarantee that the vault is operable by any editor or AI, runs on any OS, exports by copying the folder, and never locks you in.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="26">Portable Vault Profile — why your vault moves as one piece</text>
<g class="c-blue"><rect x="40" y="48" width="270" height="200" rx="12" stroke-width="0.5"/><text class="th" x="56" y="72" text-anchor="start">THE RULES EVERY FILE FOLLOWS</text><text class="ts" x="56" y="100" text-anchor="start">Plain UTF-8 Markdown</text><text class="ts" x="56" y="124" text-anchor="start">Stable, immutable IDs (id, not path)</text><text class="ts" x="56" y="148" text-anchor="start">Cross-platform-safe names &amp; paths</text><text class="ts" x="56" y="172" text-anchor="start">File classes + authority markings</text><text class="ts" x="56" y="196" text-anchor="start">Folder-registry indirection</text><text class="ts" x="56" y="220" text-anchor="start">Plain-text links</text></g>
<text class="ts" x="340" y="140" text-anchor="middle">guarantees</text>
<line x1="310" y1="148" x2="370" y2="148" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="370" y="48" width="270" height="200" rx="12" stroke-width="0.5"/><text class="th" x="386" y="72" text-anchor="start">WHAT YOU GET</text><text class="ts" x="386" y="100" text-anchor="start">Operable by any editor, script, or AI</text><text class="ts" x="386" y="124" text-anchor="start">Runs on macOS · Windows · Linux</text><text class="ts" x="386" y="148" text-anchor="start">Export = copy the folder (nothing else)</text><text class="ts" x="386" y="172" text-anchor="start">Obsidian &amp; Git are both optional</text><text class="ts" x="386" y="196" text-anchor="start">No vendor lock-in — you always own it</text><text class="ts" x="386" y="220" text-anchor="start">Change the AI; the folder comes with you</text></g>
<text class="ts" x="40" y="272" text-anchor="start">Delete .obsidian/ and lose no meaning. Git is optional for reading &amp; recovery. One writer at a time (v1).</text>
</svg>