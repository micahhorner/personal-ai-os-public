<svg width="100%" viewBox="0 0 680 312" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — metadata and relationship model</title>
<desc>Records carry nine relationship types stored once in the dependent item, with reverse views generated automatically. Provenance and epistemic fields record confidence and verification so inference is never shown as direct evidence.</desc>
<text class="th" x="40" y="28">How records link and carry provenance — stored once, reversed automatically</text>
<g class="c-blue"><rect x="40" y="48" width="250" height="250" rx="12" stroke-width="0.5"/><text class="th" x="56" y="72" text-anchor="start">Relationship types (9)</text><text class="ts" x="56" y="96" text-anchor="start">sources — grounded in evidence</text><text class="ts" x="56" y="116" text-anchor="start">derived_from — lineage</text><text class="ts" x="56" y="136" text-anchor="start">depends_on — change → check me</text><text class="ts" x="56" y="156" text-anchor="start">supersedes — replaces older</text><text class="ts" x="56" y="176" text-anchor="start">superseded_by — (validator sets)</text><text class="ts" x="56" y="196" text-anchor="start">supports — evidence for</text><text class="ts" x="56" y="216" text-anchor="start">contradicts — conflicts, both kept</text><text class="ts" x="56" y="236" text-anchor="start">related — untyped link</text><text class="ts" x="56" y="256" text-anchor="start">entities — people / orgs / products</text></g>
<g class="c-amber"><rect x="310" y="48" width="330" height="112" rx="12" stroke-width="0.5"/><text class="th" x="326" y="72" text-anchor="start">Direction rule</text><text class="ts" x="326" y="96" text-anchor="start">Store the link once — in the dependent,</text><text class="ts" x="326" y="114" text-anchor="start">derived, or newer item.</text><text class="ts" x="326" y="136" text-anchor="start">Reverse views are generated by aios generate,</text><text class="ts" x="326" y="150" text-anchor="start">never hand-maintained.</text></g>
<g class="c-teal"><rect x="310" y="174" width="330" height="124" rx="12" stroke-width="0.5"/><text class="th" x="326" y="198" text-anchor="start">Provenance &amp; epistemic status</text><text class="ts" x="326" y="222" text-anchor="start">confidence — high · medium · low · unknown</text><text class="ts" x="326" y="242" text-anchor="start">verification — verified … inferred … unverified</text><text class="ts" x="326" y="262" text-anchor="start">captured_at · original_location (sources)</text><text class="ts" x="326" y="284" text-anchor="start">Inference is never shown as direct evidence.</text></g>
</svg>