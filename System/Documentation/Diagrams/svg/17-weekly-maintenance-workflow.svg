<svg width="100%" viewBox="0 0 680 364" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — weekly maintenance workflow</title>
<desc>The seven-step weekly maintenance pass run by the Steward or on request: health report, an Inbox report that is never drained without a separate yes, freshness triage, drift checks, rebuild generated views, checkpoint with a zip snapshot, and deliver the human review queue.</desc>
<text class="th" x="40" y="28">The weekly maintenance pass — run by the Steward or on request</text>
<g class="c-teal"><rect x="40" y="44" width="600" height="36" rx="9" stroke-width="0.5"/><text class="th" x="58" y="64" text-anchor="start" style="font-size:15px">1</text><text class="th" x="98" y="64" text-anchor="start">aios health</text><text class="ts" x="624" y="64" text-anchor="end">validate · links · dupes · review · inbox</text></g>
<g class="c-teal"><rect x="40" y="86" width="600" height="36" rx="9" stroke-width="0.5"/><text class="th" x="58" y="106" text-anchor="start" style="font-size:15px">2</text><text class="th" x="98" y="106" text-anchor="start">Report the Inbox</text><text class="ts" x="624" y="106" text-anchor="end">Steward counts and offers; never drains it</text></g>
<g class="c-teal"><rect x="40" y="128" width="600" height="36" rx="9" stroke-width="0.5"/><text class="th" x="58" y="148" text-anchor="start" style="font-size:15px">3</text><text class="th" x="98" y="148" text-anchor="start">Freshness triage</text><text class="ts" x="624" y="148" text-anchor="end">bump · re-derive · stale · supersede</text></g>
<g class="c-teal"><rect x="40" y="170" width="600" height="36" rx="9" stroke-width="0.5"/><text class="th" x="58" y="190" text-anchor="start" style="font-size:15px">4</text><text class="th" x="98" y="190" text-anchor="start">Drift checks</text><text class="ts" x="624" y="190" text-anchor="end">adapters · hashes · index · authority</text></g>
<g class="c-teal"><rect x="40" y="212" width="600" height="36" rx="9" stroke-width="0.5"/><text class="th" x="58" y="232" text-anchor="start" style="font-size:15px">5</text><text class="th" x="98" y="232" text-anchor="start">aios generate</text><text class="ts" x="624" y="232" text-anchor="end">rebuild indexes &amp; views</text></g>
<g class="c-green"><rect x="40" y="254" width="600" height="36" rx="9" stroke-width="0.5"/><text class="th" x="58" y="274" text-anchor="start" style="font-size:15px">6</text><text class="th" x="98" y="274" text-anchor="start">aios checkpoint --zip</text><text class="ts" x="624" y="274" text-anchor="end">fresh human-restorable snapshot</text></g>
<g class="c-teal"><rect x="40" y="296" width="600" height="36" rx="9" stroke-width="0.5"/><text class="th" x="58" y="316" text-anchor="start" style="font-size:15px">7</text><text class="th" x="98" y="316" text-anchor="start">Deliver review queue</text><text class="ts" x="624" y="316" text-anchor="end">one line per call, by consequence</text></g>
<text class="ts" x="40" y="352" text-anchor="start">Recommend-only: the Steward queues and reports; the ordinary runtime executes ingestion. &gt;10 items → retune cadence.</text>
</svg>