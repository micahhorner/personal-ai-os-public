</g>
<g class="c-green"><rect x="454" y="250" width="186" height="98" rx="12" stroke-width="0.5"/>
 <text class="th" x="470" y="272" text-anchor="start">Agents (3)</text>
 <text class="ts" x="470" y="296" text-anchor="start">steward</text>
