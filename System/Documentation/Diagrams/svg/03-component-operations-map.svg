<g class="c-gray"><rect x="40" y="468" width="600" height="44" rx="10" stroke-width="0.5"/><text class="th" x="340" y="490" text-anchor="middle" dominant-baseline="central">The Vault — 00–90 content + System rules · plain files you own</text></g>
</svg>