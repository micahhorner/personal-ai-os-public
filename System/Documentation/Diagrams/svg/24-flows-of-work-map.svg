<svg width="100%" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Personal AI OS — flows of work (user tasks)</title>
<desc>The eleven things a user does with AI OS, grouped by when they use them: set up once, the daily loop (capture, ask, record a decision, add spoken context, produce output), keep it healthy weekly, and grow or recover as needed.</desc>
<text class="th" x="40" y="26">Everything you do with AI OS — your flows of work</text>
<g class="c-blue"><rect x="40" y="40" width="600" height="80" rx="14" stroke-width="0.5"/><text class="ts" x="54" y="59" text-anchor="start">SET UP · once</text>
 <g class="node" onclick="sendPrompt('Walk me through getting set up (onboarding) in AI OS')"><rect x="54" y="70" width="276" height="38" rx="9" stroke-width="0.5"/><text class="th" x="192" y="89" text-anchor="middle" dominant-baseline="central">1 · Get set up (onboarding)</text></g>
 <g class="node" onclick="sendPrompt('Walk me through bringing my own method and notes into AI OS')"><rect x="340" y="70" width="276" height="38" rx="9" stroke-width="0.5"/><text class="th" x="478" y="89" text-anchor="middle" dominant-baseline="central">8 · Bring your own method &amp; notes</text></g>
</g>
<g class="c-green"><rect x="40" y="128" width="600" height="108" rx="14" stroke-width="0.5"/><text class="ts" x="54" y="147" text-anchor="start">THE DAILY LOOP</text>
 <g class="node" onclick="sendPrompt('Walk me through the Capture and file flow in AI OS')"><rect x="52" y="158" width="104" height="60" rx="9" stroke-width="0.5"/><text class="th" x="104" y="182" text-anchor="middle" dominant-baseline="central">2 · Capture</text><text class="ts" x="104" y="200" text-anchor="middle" dominant-baseline="central">&amp; file</text></g>
 <g class="node" onclick="sendPrompt('Walk me through asking questions and getting cited answers in AI OS')"><rect x="171" y="158" width="104" height="60" rx="9" stroke-width="0.5"/><text class="th" x="223" y="182" text-anchor="middle" dominant-baseline="central">3 · Ask</text><text class="ts" x="223" y="200" text-anchor="middle" dominant-baseline="central">cited answers</text></g>
 <g class="node" onclick="sendPrompt('Walk me through recording a decision in AI OS')"><rect x="290" y="158" width="104" height="60" rx="9" stroke-width="0.5"/><text class="th" x="342" y="182" text-anchor="middle" dominant-baseline="central">4 · Record</text><text class="ts" x="342" y="200" text-anchor="middle" dominant-baseline="central">a decision</text></g>
 <g class="node" onclick="sendPrompt('Walk me through capturing spoken or tacit context in AI OS')"><rect x="409" y="158" width="104" height="60" rx="9" stroke-width="0.5"/><text class="th" x="461" y="182" text-anchor="middle" dominant-baseline="central">5 · Add</text><text class="ts" x="461" y="200" text-anchor="middle" dominant-baseline="central">spoken context</text></g>
 <g class="node" onclick="sendPrompt('Walk me through producing a deliverable in AI OS')"><rect x="528" y="158" width="104" height="60" rx="9" stroke-width="0.5"/><text class="th" x="580" y="182" text-anchor="middle" dominant-baseline="central">6 · Produce</text><text class="ts" x="580" y="200" text-anchor="middle" dominant-baseline="central">output</text></g>
</g>
<g class="c-amber"><rect x="40" y="244" width="600" height="76" rx="14" stroke-width="0.5"/><text class="ts" x="54" y="263" text-anchor="start">KEEP IT HEALTHY · weekly</text>
 <g class="node" onclick="sendPrompt('Walk me through weekly maintenance in AI OS')"><rect x="54" y="274" width="276" height="36" rx="9" stroke-width="0.5"/><text class="th" x="192" y="292" text-anchor="middle" dominant-baseline="central">7 · Weekly maintenance</text></g>
 <g class="node" onclick="sendPrompt('Walk me through reviewing the AI work in AI OS')"><rect x="340" y="274" width="276" height="36" rx="9" stroke-width="0.5"/><text class="th" x="478" y="292" text-anchor="middle" dominant-baseline="central">10 · Review the AI's work</text></g>
</g>
<g class="c-purple"><rect x="40" y="328" width="600" height="76" rx="14" stroke-width="0.5"/><text class="ts" x="54" y="347" text-anchor="start">GROW &amp; RECOVER · as needed</text>
 <g class="node" onclick="sendPrompt('Walk me through growing or extending AI OS with a new capability')"><rect x="54" y="358" width="276" height="36" rx="9" stroke-width="0.5"/><text class="th" x="192" y="376" text-anchor="middle" dominant-baseline="central">9 · Grow the system</text></g>
 <g class="node" onclick="sendPrompt('Walk me through stopping and recovering in AI OS')"><rect x="340" y="358" width="276" height="36" rx="9" stroke-width="0.5"/><text class="th" x="478" y="376" text-anchor="middle" dominant-baseline="central">11 · Stop &amp; recover</text></g>
