<svg width="100%" viewBox="0 0 680 250" role="img">
<title>AI OS flow — Review the AI's Work (user walkthrough)</title>
<desc>The review flow from the user's view: you ask what changed; the journal shows every consequential change, stale flags mark affected notes, approvals track outside-use material; you get a plain-language audit trail and a clear queue of judgment calls.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="26">Review the AI's work (Flow 10)</text>
<text class="ts" x="130" y="52" text-anchor="middle">YOU DO</text>
<text class="ts" x="340" y="52" text-anchor="middle">BEHIND THE SCENES</text>
<text class="ts" x="550" y="52" text-anchor="middle">YOU GET</text>
<g class="c-blue"><rect x="40" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="th" x="56" y="88" text-anchor="start">Skim the journal weekly, or</text><text class="th" x="56" y="106" text-anchor="start">ask:</text><text class="th" x="56" y="124" text-anchor="start"></text><text class="th" x="56" y="142" text-anchor="start">"Show me what you</text><text class="th" x="56" y="160" text-anchor="start">changed today."</text></g>
<line x1="220" y1="137" x2="250" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="250" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="266" y="88" text-anchor="start">Journals every consequential</text><text class="ts" x="266" y="106" text-anchor="start">+ structural change</text><text class="ts" x="266" y="124" text-anchor="start">Marks affected notes stale</text><text class="ts" x="266" y="142" text-anchor="start">(never silent rewrites)</text><text class="ts" x="266" y="160" text-anchor="start">Approved items drop to</text><text class="ts" x="266" y="178" text-anchor="start">pending when edited</text></g>
<line x1="430" y1="137" x2="460" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="460" y="60" width="180" height="154" rx="12" stroke-width="0.5"/><text class="ts" x="476" y="88" text-anchor="start">A plain-language audit trail</text><text class="ts" x="476" y="106" text-anchor="start">you can verify</text><text class="ts" x="476" y="124" text-anchor="start">A clear queue of what needs</text><text class="ts" x="476" y="142" text-anchor="start">your judgment</text></g>
<text class="ts" x="40" y="238" text-anchor="start">Trust you can verify, not trust you have to assume — the journal is your audit trail.</text>
</svg>
