# diagram-metadata.yaml — rich, human-and-machine-readable description of what
# each diagram actually displays. This is the primary corpus for the support
# chatbot and the source for the catalog's prose. `aios doc-check` REQUIRES a
# non-empty description here for every diagram in coverage.yaml, so a diagram
# without a description fails the gate. `aios doc-audit` reads these descriptions
# too (DEC-105): they are prose, and a count or a retired promise is as wrong
# here as it is in a manual.
#
# Fields per diagram:
#   description : 1-3 sentences on what the diagram literally shows.
#   displays    : the concrete elements/labels a viewer sees.
#   answers     : example questions this diagram helps a user answer.
#   source_docs : the canonical product docs it is grounded in.
#   audience    : who it is for.

"01":
  description: >-
    The five layers of a Personal AI OS instance shown as a vertical stack, from
    the durable portable core (your knowledge folders plus the System rulebook)
    at the top down to generated and runtime state at the bottom. Generated
    publications are disposable; Logs is mixed state whose freshness history
    and obligations must be preserved. The AI is a swappable guest and the
    folder is the owned asset.
  displays: [durable portable core, personal configuration (80 User), governance & operations (System), adapters, generated and mixed runtime state]
  answers: ["What are the parts of AI OS?", "What do I actually own?", "Where does my data live vs. the rules?"]
  source_docs: [Architecture/System Map.md, Documentation/Product Overview.md]
  audience: anyone orienting to the product

"02":
  description: >-
    How information moves through the system: capture in the Inbox, ingest and
    connect into canonical knowledge, and out to cited outputs — with the
    governance lane (preflight, apply, journal, checkpoint) that every write
    passes through, plus the kill switch and rollback.
  displays: [Inbox, ingest & connect, canonical knowledge, outputs, preflight, apply, journal, checkpoint]
  answers: ["What happens to something I add?", "How are writes kept safe?", "How do outputs get cited?"]
  source_docs: [Architecture/System Map.md, Governance/Change Control and Preflight.md]
  audience: understanding the flow of information and write safety

"03":
  description: >-
    The hourglass architecture: runtimes at the top, adapters translating down to
    the runtime-neutral contract of 15 operations at the waist, then the fourteen
    capabilities, three agents, and two workflows that rest on it, all acting on
    the vault of plain files.
  displays: [runtimes, adapters, 15 operations, capabilities, agents, workflows, the vault]
  answers: ["What are the functional pieces?", "How do runtimes connect to the vault?", "What sits on the operation contract?"]
  source_docs: [Generated/component-index.json, Operations/operations.yaml, Architecture/Canonical Architecture Specification.md]
  audience: developers and operators

"04":
