"40":
  description: >-
    The session-handoff loop: a substantive session closes by sweeping the change
    journal, checkpointing, validating, and recording an honest stopping point —
    what was done with evidence, open items in order, anything left broken. A later
    cold session reads that record before acting, re-verifies its claims against
    live state with scripts, and restates the frame before writing. Trivial Q&A
    sessions produce no record; the record's form is the user's (80 User/handoff.md,
    method packs), the floors are not.
  displays: [journal sweep, checkpoint + validate, honest stopping point, cold resume, record read first, claims re-verified]
  answers: ["How do I end a session so nothing is lost?", "How does a new session pick up old work?", "Why does the AI re-check what the handoff says?"]
  source_docs: [Capabilities/session-handoff/SKILL.md]
  audience: anyone working across multiple sessions
"41":
  description: >-
    The manage-todo loop: "add X to my to-do list" routes to the manage-todo
    capability, which drafts all four context parts of the item (what, why it
    matters, what it blocks, a path that resolves) from the conversation, asks at
    most one clarifying question, link-checks every path the item touches — dead
    paths are flagged in place, the rot detector — then writes, bumps updated, and
    validates. Completing moves items to Done with the date; reprioritizing
    reorders. A bare file reference is not an item; counts about the vault come
    from scripts, never from the list's prose.
  displays: [routed add, four-part item contract, one question max, link-check + rot flag, write + validate, done and reprioritize]
  answers: ["How do I add something to my to-do list?", "Why does the AI ask one question before writing an item?", "How do dead references in the list get caught?"]
  source_docs: [Capabilities/manage-todo/SKILL.md]
  audience: everyone — the daily capture loop
"42":
  description: >-
    The start-project flow: "let's start a project" routes to the start-project
    capability, which resolves the name first (an existing project is resumed, not
    duplicated), creates the folder under 10 Projects, creates a schema-valid
    project note from the template with a minted id and stage, registers it with
    aios generate, validates, and states where next actions go. Plans, handoffs,
    and gates belong to an installed method pack — consulted by mention, never
    rebuilt by the generic floor.
  displays: [resolve first, folder under 10 Projects, template note with minted id, register + validate, where actions go, method-pack consult line]
  answers: ["How do I start a project?", "Why doesn't the AI create a plan document?", "What happens if the project already exists?"]
  source_docs: [Capabilities/start-project/SKILL.md]
  audience: anyone starting bounded multi-session work
"43":
  description: >-
    The record-decision flow: a settled choice ("let's go with option B",
    "approved", "we're not doing X") routes to the record-decision capability.
    The bar is honest — a decision closes alternatives or changes scope; a
    preference is not one. The capability resolves first (a same-question record
    means supersession, never a duplicate), drafts the whole record from the
    conversation (decision, why, alternatives, evidence, tacit context, project
    link), asks at most one clarifying question, mints a dated slug id — no
    record ever claims a number — writes to the top-level Decisions folder, then
    runs aios generate and validate. The register view is derived from
    frontmatter on every rebuild, newest first and grouped by project, so
    decisions recorded in parallel cannot collide by construction.
  displays: [the decision bar, resolve first + supersession, record drafted from context, one question max, dated slug id — no claimed numbers, Decisions/ home, derived register view]
  answers: ["How do I record a decision?", "Where do my decisions live?", "Why don't decisions get numbers?", "What happens when a decision changes?"]
  source_docs: [Capabilities/record-decision/SKILL.md]
  audience: everyone — the moment a choice settles
"44":
  description: >-
    The adversary pre-build gate: a deliberately hostile read of a plan, spec, or
    scope BEFORE construction starts. It fires on demand ("red-team this",
    "pressure-test this") or as build-extension step 3b on any High-tier build —
    a new schema, template, capability, agent, script, workflow, or structural
    change — before a single file is created. The pass sets its frame (attack the
    work not the author; record whether this is a self-review), steelmans the plan
    first, then runs five separate reads over the same text: load-bearing
    assumptions each with how we would know it is false, failure modes the plan
    never names, the cheaper version a skeptic would build instead, scope traps
    and hidden dependencies, and the plan-killer named singly and ranked first.
    Every finding cites the line it attacks and states its own falsifier, and the
    report must name at least one thing the plan gets right — the anti-theater
    rule. The verdict is proceed, proceed-with-amendments, or redesign; it advises
    and never blocks, the report is filed as working material beside the plan, and
    a skipped gate is recorded as skipped-with-owner-OK rather than passing
    silently. Two permanent evals keep it falsifiable: a seeded-flaw fixture and a
    retrodiction run against a real spec with a known post-hoc correction.
  displays: [the trigger — on demand or the High-tier gate, steelman before attack, the five reads, line citation plus falsifier per finding, one thing named right, the three-verdict scale, working-material filing and recorded skips]
  answers: ["How do I get a plan attacked before I build it?", "What stops the red-team pass from being theater?", "Does the adversary block my build?", "Where does the report go?", "What happens if we skip the gate?"]
  source_docs: [Capabilities/adversary/SKILL.md, Capabilities/build-extension/SKILL.md]
  audience: anyone about to spend real effort on a plan
