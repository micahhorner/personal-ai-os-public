# coverage.yaml — the machine-readable source of truth for atlas coverage.
#
# This file is what makes "is everything documented?" a checkable question
# instead of a hopeful one. `aios doc-check` enumerates every component in the
# product (capabilities, agents, workflows) from the filesystem, and FAILS if
# any of them is absent from `components` below, or if any referenced diagram
# file is missing. The human-readable tables in CATALOG.md are HAND-maintained:
# `doc-check` verifies only that each registered diagram is listed somewhere in
# that file, so a stale status row does not fail the gate. (These comments named
# a `check_coverage.py` that has never existed in the product tree; the gate has
# always been `doc-check`.)
#
# When you add a component to AI OS: the checker fails until you (1) author the
# diagram SVG, (2) add its entry to `diagrams`, and (3) map the component here.

product: personal-ai-os
product_path: ../../..               # from System/Documentation/Diagrams/ to the product root
svg_dir: svg

