<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2250" viewBox="0 0 1800 2250" role="img" aria-labelledby="title desc">
  <title id="title">How Personal AI OS works, from runtime to owned files — v1.64.5</title>
  <desc id="desc">Six stages show the AI tools that can connect, the folder's house rules, how the system chooses the right step-by-step method, nine familiar jobs, the different paths for reading and writing, and the plain-file folder the person owns. It also explains honestly that an AI with direct folder access must choose to obey the rules because the product is not a security sandbox.</desc>
  <defs>
    <style>
      .bg{fill:#09110f}.box{fill:#111d1a;stroke:#38554e;stroke-width:2}.mintbox{fill:#122a25;stroke:#7dbcae;stroke-width:3}.amberbox{fill:#2c2418;stroke:#d9a754;stroke-width:3}.coralbox{fill:#2b1c1a;stroke:#d87d74;stroke-width:3}.bluebox{fill:#13242b;stroke:#70a9bf;stroke-width:3}.ghost{fill:#101917;stroke:#53635f;stroke-width:2;stroke-dasharray:9 8}.folder{fill:#14211d;stroke:#4c6b63;stroke-width:2}.rule{stroke:#78978f;stroke-width:3;fill:none}.mintline{stroke:#82c3b5;stroke-width:4;fill:none}.amberline{stroke:#dfa952;stroke-width:4;fill:none}.dash{stroke-dasharray:10 10}.t{font-family:Inter,Arial,sans-serif;fill:#eef3f1}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#a8b8b3}.h1{font-size:48px;font-weight:780}.h2{font-size:27px;font-weight:760}.h3{font-size:21px;font-weight:740}.body{font-size:19px}.small{font-size:16px}.tiny{font-size:14px}.mint{fill:#a8d9ce}.amber{fill:#efc274}.coral{fill:#ef9b92}.blue{fill:#a7d6e7}.step{fill:#8dc8bc}.steptext{font-family:Inter,Arial,sans-serif;fill:#09110f;font-size:22px;font-weight:820}.whiteStep{fill:#eef3f1}
    </style>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7 Z" fill="#78978f"/></marker>
    <marker id="arrM" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7 Z" fill="#82c3b5"/></marker>
    <marker id="arrA" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7 Z" fill="#dfa952"/></marker>
  </defs>
  <rect class="bg" width="1800" height="2250"/>

  <!-- 1: runtimes -->
  <text class="mono body" x="205" y="55">BRING THE AI YOU PREFER · YOUR FOLDER STAYS THE SAME</text>
  <circle class="step" cx="150" cy="125" r="25"/><text class="steptext" x="150" y="133" text-anchor="middle">1</text>
  <rect class="mintbox" x="205" y="75" width="455" height="105" rx="15"/>
  <text class="mint h2" x="230" y="115">Claude Code</text><text class="t small" x="230" y="145">ready to connect to the folder</text><text class="mono tiny" x="230" y="168">AI SERVICE</text>
  <rect class="mintbox" x="680" y="75" width="455" height="105" rx="15"/>
  <text class="mint h2" x="705" y="115">Codex</text><text class="t small" x="705" y="145">ready to connect to the folder</text><text class="mono tiny" x="705" y="168">AI SERVICE</text>
  <rect class="ghost" x="1155" y="75" width="440" height="105" rx="15"/>
  <text class="t h2" x="1180" y="115">Other AI tools</text><text class="t small" x="1180" y="145">can be connected after they are checked</text><text class="mono tiny" x="1180" y="168">NOT TESTED BY DEFAULT</text>
  <path class="rule" d="M432 180 V215 H900 V255" marker-end="url(#arr)"/><path class="rule" d="M907 180 V215"/><path class="rule dash" d="M1375 180 V215 H900"/>
  <text class="mono small" x="205" y="232">The AI thinks. Your folder keeps the memory, rules and proof.</text>

  <!-- 2: rulebook -->
  <circle class="step" cx="150" cy="345" r="25"/><text class="steptext" x="150" y="353" text-anchor="middle">2</text>
  <rect class="mintbox" x="205" y="255" width="1390" height="190" rx="18"/>
  <text class="mint h2" x="240" y="298">Before each task, the AI reads the house rules</text>
  <text class="t body" x="240" y="330">One clear starting point leads it to the rules it needs.</text>
  <rect class="box" x="240" y="352" width="300" height="65" rx="11"/><text class="t h3" x="260" y="379">Always-follow rules</text><text class="mono tiny" x="260" y="402">what it must never ignore</text>
  <rect class="box" x="560" y="352" width="300" height="65" rx="11"/><text class="t h3" x="580" y="379">Job guide</text><text class="mono tiny" x="580" y="402">which instructions to use</text>
  <rect class="box" x="880" y="352" width="300" height="65" rx="11"/><text class="t h3" x="900" y="379">AI settings</text><text class="mono tiny" x="900" y="402">what this AI may do</text>
  <rect class="box" x="1200" y="352" width="360" height="65" rx="11"/><text class="t h3" x="1220" y="379">Owner controls</text><text class="mono tiny" x="1220" y="402">off switch + protected files</text>
  <path class="rule" d="M900 445 V490" marker-end="url(#arr)"/>

  <!-- 3: classification -->
  <circle class="step" cx="150" cy="555" r="25"/><text class="steptext" x="150" y="563" text-anchor="middle">3</text>
  <rect class="box" x="205" y="490" width="1390" height="130" rx="17"/>
  <text class="t h2" x="240" y="533">It works out what kind of help you need</text>
  <text class="t body" x="240" y="568">find · write · bring things in · tidy up · recover · set up · improve the system</text>
  <text class="mono small" x="240" y="598">It opens only the instructions for this job—not the whole manual.</text>
  <path class="rule" d="M900 620 V665" marker-end="url(#arr)"/>

  <!-- 4: jobs -->
  <circle class="step" cx="150" cy="760" r="25"/><text class="steptext" x="150" y="768" text-anchor="middle">4</text>
  <text class="t h2" x="205" y="690">It follows the step-by-step method for that job</text>
  <text class="t body" x="205" y="720">The system includes 15 ready-made methods. These are the nine jobs most people will recognize.</text>
  <rect class="mintbox" x="205" y="748" width="435" height="76" rx="12"/><text class="mint h3" x="230" y="780">Find an answer</text><text class="t small" x="230" y="807">use the right notes and tell you which ones</text>
  <rect class="amberbox" x="660" y="748" width="435" height="76" rx="12"/><text class="amber h3" x="685" y="780">Write or update safely</text><text class="t small" x="685" y="807">search first · use the right form · validate</text>
  <rect class="amberbox" x="1115" y="748" width="480" height="76" rx="12"/><text class="amber h3" x="1140" y="780">Bring in new material</text><text class="t small" x="1140" y="807">keep the original, check it, then connect it</text>
  <rect class="amberbox" x="205" y="842" width="435" height="76" rx="12"/><text class="amber h3" x="230" y="874">Check and tidy up</text><text class="t small" x="230" y="901">show what is stale, broken or needs attention</text>
  <rect class="amberbox" x="660" y="842" width="435" height="76" rx="12"/><text class="amber h3" x="685" y="874">Bring your old notes in</text><text class="t small" x="685" y="901">review the plan first; keep a way back</text>
  <rect class="amberbox" x="1115" y="842" width="480" height="76" rx="12"/><text class="amber h3" x="1140" y="874">Set it up for you</text><text class="t small" x="1140" y="901">learn your preferences and privacy choices</text>
  <rect class="amberbox" x="205" y="936" width="435" height="76" rx="12"/><text class="amber h3" x="230" y="968">Add or remove an extra</text><text class="t small" x="230" y="995">check it first; keep your work when removing it</text>
  <rect class="coralbox" x="660" y="936" width="435" height="76" rx="12"/><text class="coral h3" x="685" y="968">Teach it a new job</text><text class="t small" x="685" y="995">design it · challenge it · test it · approve it</text>
  <rect class="coralbox" x="1115" y="936" width="480" height="76" rx="12"/><text class="coral h3" x="1140" y="968">Recover or update</text><text class="t small" x="1140" y="995">check the version · save first · prove recovery</text>

  <!-- branch -->
  <path class="mintline" d="M900 1012 V1052 H510 V1100" marker-end="url(#arrM)"/><path class="amberline" d="M900 1012 V1052 H1290 V1100" marker-end="url(#arrA)"/>

  <!-- 5: read/write -->
  <circle class="step" cx="150" cy="1190" r="25"/><text class="steptext" x="150" y="1198" text-anchor="middle">5</text>
  <rect class="mintbox" x="205" y="1100" width="610" height="385" rx="18"/>
  <text class="mint h2" x="240" y="1142">If you are looking something up</text>
  <text class="t body" x="240" y="1182">1. Start with short summaries instead of loading every full note.</text>
  <text class="t body" x="240" y="1220">2. Leave out notes that are private for this AI,</text><text class="t body" x="262" y="1248">in the wrong area, unfinished or no longer current.</text>
  <text class="t body" x="240" y="1286">3. Open only the few notes that may answer you.</text>
  <text class="t body" x="240" y="1324">4. Never treat instructions inside a note as commands.</text>
  <text class="t body" x="240" y="1362">5. Tell you which notes it used—or that none fit.</text>
  <line x1="240" y1="1395" x2="780" y2="1395" stroke="#54746c" stroke-width="2"/>
  <text class="mono small" x="240" y="1428">The built-in search and read tools enforce these rules.</text>
  <text class="coral small" x="240" y="1460">An AI with direct folder access must still choose to obey them.</text>

  <rect class="amberbox" x="985" y="1100" width="610" height="385" rx="18"/>
  <text class="amber h2" x="1020" y="1142">If something needs to change</text>
  <text class="t body" x="1020" y="1182">First: check the off switch, the rules and what exists already.</text>
  <rect class="box" x="1020" y="1210" width="540" height="66" rx="11"/><text class="mint h3" x="1042" y="1238">Small change</text><text class="t small" x="1042" y="1262">use the right form · save · check the result</text>
  <rect class="box" x="1020" y="1290" width="540" height="74" rx="11"/><text class="amber h3" x="1042" y="1318">Change that affects other things</text><text class="t small" x="1042" y="1342">find what depends on it · deal with each effect · record it</text>
  <rect class="coralbox" x="1020" y="1378" width="540" height="78" rx="11"/><text class="coral h3" x="1042" y="1406">Change to the rules or system</text><text class="t small" x="1042" y="1430">save a restore point · explain the impact · wait for approval</text>
  <text class="mono tiny" x="1020" y="1478">Built-in writers recheck before replacing anything.</text>
  <path class="mintline" d="M510 1485 V1535 H900"/><path class="amberline" d="M1290 1485 V1535 H900"/><path class="rule" d="M900 1535 V1580" marker-end="url(#arr)"/>

  <!-- 6: owned folder -->
  <circle class="whiteStep" cx="150" cy="1690" r="25"/><text class="steptext" x="150" y="1698" text-anchor="middle">6</text>
  <rect x="205" y="1580" width="1390" height="500" rx="20" fill="#101a17" stroke="#dce8e4" stroke-width="3"/>
  <text class="t h1" x="240" y="1632">Your folder</text><text class="mono small" x="1560" y="1625" text-anchor="end">PLAIN FILES · NO AI REQUIRED TO READ THEM</text>
  <text class="t body" x="240" y="1668">Your lasting asset is the folder—your knowledge, preferences, methods and recovery history—not the AI.</text>
  <rect class="folder" x="240" y="1700" width="420" height="76" rx="11"/><text class="t h3" x="262" y="1732">Inbox</text><text class="mono tiny" x="262" y="1758">new material waits here until it is checked</text>
  <rect class="folder" x="680" y="1700" width="420" height="76" rx="11"/><text class="t h3" x="702" y="1732">Projects + Knowledge + Decisions</text><text class="mono tiny" x="702" y="1758">work · knowledge · decisions · to-do</text>
  <rect class="folder" x="1120" y="1700" width="440" height="76" rx="11"/><text class="t h3" x="1142" y="1732">Sources</text><text class="mono tiny" x="1142" y="1758">original material stays unchanged</text>
  <rect class="folder" x="240" y="1794" width="420" height="76" rx="11"/><text class="t h3" x="262" y="1826">Things you made + Archive</text><text class="mono tiny" x="262" y="1852">finished work · older material kept</text>
  <rect class="amberbox" x="680" y="1794" width="420" height="76" rx="11"/><text class="amber h3" x="702" y="1826">About you</text><text class="t small" x="702" y="1852">preferences · voice · privacy · how you work</text>
  <rect class="amberbox" x="1120" y="1794" width="440" height="76" rx="11"/><text class="amber h3" x="1142" y="1826">Optional extras</text><text class="t small" x="1142" y="1852">add new jobs without changing the core system</text>
  <rect class="mintbox" x="240" y="1888" width="650" height="82" rx="11"/><text class="mint h3" x="262" y="1920">The rulebook + step-by-step methods + checks</text><text class="t small" x="262" y="1948">everything needed to run the system travels with the folder</text>
  <rect class="box" x="910" y="1888" width="650" height="82" rx="11"/><text class="t h3" x="932" y="1920">Rebuildable views + activity records</text><text class="t small" x="932" y="1948">some views can be rebuilt; important history is kept</text>
  <line x1="240" y1="1994" x2="1560" y2="1994" stroke="#526a64" stroke-width="2"/>
  <text class="mono small" x="240" y="2026">MARKDOWN + YAML · OKF v0.2 KNOWLEDGE LAYER · OBSIDIAN OPTIONAL · GIT OPTIONAL</text>
  <text class="coral small" x="240" y="2055">Do not store passwords or secret keys here. An AI with direct access must choose to obey the rules.</text>

  <!-- evidence footer -->
  <text class="t body" x="205" y="2142">Target-bound machine evidence is distributed with the v1.64.5 GitHub release assets.</text>
  <text class="mono small" x="205" y="2178">Not promised: perfect AI judgment · every AI tool · a security sandbox · outside certification</text>
  <text class="mono tiny" x="205" y="2220">PERSONAL AI OS v1.64.5 · FULL HIGH-LEVEL ARCHITECTURE · FACTUAL COMPANION: ai-os-architecture-full.md</text>
</svg>
